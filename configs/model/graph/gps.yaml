_target_: topobench.model.TBModel

model_name: GPS 
model_domain: graph

feature_encoder:
  _target_: topobench.nn.encoders.${model.feature_encoder.encoder_name}
  encoder_name: AllCellFeatureEncoder
  in_channels: ${infer_in_channels:${dataset},${oc.select:transforms,null}} 
  out_channels: 16
  proj_dropout: 0.2

backbone:
  _target_: topobench.nn.backbones.GPSEncoder
  input_dim: ${model.feature_encoder.out_channels}
  hidden_dim: ${model.feature_encoder.out_channels} # SWEEP!: [32,64] (not more because feature dim of graph only 15)
  num_layers: 2 # SWEEP: [2,4] (3 if we have a lot of time)
  dropout: 0.2 # SWEEP: [0.0, 0.25, 0.5]
  heads: 4 # SWEEP: [4,8]
  attn_type: performer # SWEEP: [multihead, performer] - using performer for large graphs to avoid OOM
  local_conv_type: gin # no sweep. 

backbone_wrapper:
  _target_: topobench.nn.wrappers.${model.backbone_wrapper.wrapper_name}
  _partial_: true
  wrapper_name: GNNWrapper
  out_channels: ${model.feature_encoder.out_channels}
  residual_connections: false
  num_cell_dimensions: ${infer_num_cell_dimensions:${oc.select:model.feature_encoder.selected_dimensions,null},${model.feature_encoder.in_channels}}

readout:
  _target_: topobench.nn.readouts.${model.readout.readout_name}
  readout_name: FTDReadOut #FTDReadOut #  Use <NoReadOut> in case readout is not needed Options: PropagateSignalDown
  num_cell_dimensions: ${infer_num_cell_dimensions:${oc.select:model.feature_encoder.selected_dimensions,null},${model.feature_encoder.in_channels}} # The highest order of cell dimensions to consider
  hidden_dim: ${get_flattened_feature_matrix_dim:${dataset.loader.parameters.num_nodes},${model.backbone_wrapper.out_channels}}
  out_channels: ${dataset.parameters.num_classes}
  task_level: ${dataset.parameters.task_level}
  pooling_type: sum
  in_channels: ${model.backbone_wrapper.out_channels}
  num_nodes: ${oc.select:dataset.loader.parameters.num_nodes,null}
  use_features: false
  use_feature_encoder: true 
  which_layer: ['sex', 'mutation', 'age']
  fc_dim: [128, 64, 32]
  fc_dropout: 0.4
  fc_act: relu
  fc_input_dim: ${model.backbone_wrapper.out_channels}
  graph_encoder_dim: 64
  feature_encoder_dim: 16
