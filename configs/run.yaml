# @package _global_

# specify here default configuration
# order of defaults determines the order in which configs override each other
defaults:
  - _self_
  - dataset: graph/FTD
  - model: graph/mlp
  - transforms: ${get_default_transform:${dataset},${model}} #no_transform
  - optimizer: default
  - loss: default
  - evaluator: default
  - callbacks: default
  - logger: wandb # set logger here or use command line (e.g. `python train.py logger=tensorboard`)
  - trainer: ${get_default_trainer:} #default
  - paths: default
  - extras: default
  - hydra: default

  # experiment configs allow for version control of specific hyperparameters
  # e.g. best hyperparameters for given model and datamodule
  - experiment: null

  # config for hyperparameter optimization
  - hparams_search: null

  # # optional local config for machine/user specific settings
  # # it's optional since it doesn't need to exist and is excluded from version control
  # - optional local: default

  # debugging config (enable through command line, e.g. `python train.py debug=default)
  - debug: null

# evaluator: ${dataset.parameters.task}
# callbacks: ${dataset.parameters.task}

# task name, determines output directory path
task_name: "train"

# tags to help you identify your experiments
# you can overwrite this in experiment configs
# overwrite from command line with `python train.py tags="[first_tag, second_tag]"`
tags: ["dev"]

# set False to skip model training
train: True

# evaluate on test set, using best model weights achieved during training
# lightning chooses best weights based on the metric specified in checkpoint callback
test: True

# evaluate on OOD test set (e.g., sporadic FTD) after training
# requires ood_dataset config to be specified
test_ood: False

# OOD dataset config (e.g., sporadic FTD)
# Should match the training dataset config parameters (y_val, modality, etc.) 
# to load the correct scalers and adjacency matrix
ood_dataset: null
# Example:
# ood_dataset:
#   loader:
#     _target_: topobench.data.loaders.graph.sporadic_ftd_dataset_loader.SporadicFTDDatasetLoader
#     parameters:
#       data_domain: graph
#       data_type: proteomics
#       data_name: SporadicFTD
#       dataset_name: "sporadic_ftd"
#       raw_file_name: "cleanDat.Soma.CSFneat.macwide_allftdannotations_merged.csv"
#       error_protein_file_name: "bimodal_aptamers_for_removal.xlsx"
#       two_pass_error_protein_file_name: "cleanDat.Soma.CSF.Blood.PC.Age.Sex.Reg.2pass.filtered.5SDWinsor.csv"
#       y_val: "global_cog_slope"  # Must match training dataset
#       modality: "csf"  # Must match training dataset
#       ftd_mutation: ['GRN', 'MAPT','C9orf72','CTL']  # For matching FTD experiment ID
#       sex: ['M', 'F']  # Must match training dataset
#       num_nodes: 3667  # Must match training dataset
#       adj_metric: "wgcna"  # Must match training dataset
#       adj_thresh: 0.976  # Must match training dataset
#       kfold: false  # Must match training dataset
#       num_folds: 5
#       fold: 0
#       random_state: 42  # Must match training dataset
#       data_dir: ${paths.data_dir}/SporadicFTD
#       ftd_root: ${paths.data_dir}/FTD
#       two_pass: True  # Must match training dataset
#   dataloader_params:
#     batch_size: 16
#     num_workers: 0
#     pin_memory: False

# simply provide checkpoint path to resume training
ckpt_path: null

# seed for random number generators in pytorch, numpy and python.random
seed: 42

# make cudnn backend fully reproducible
deterministic: False